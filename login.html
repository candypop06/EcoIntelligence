<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — EcoIntelligence</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom brand palette -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf6', 100: '#dcfce9', 200: '#bbf7d2',
              400: '#4ade82', 500: '#22c55e', 600: '#16a34a', 700: '#15803c',
            },
            teal: {
              400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488',
            },
          },
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] },
        },
      },
    };
  </script>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* Page fill */
    body { min-height: 100vh; }

    /* Smooth focus ring */
    .form-input {
      display: block; width: 100%;
      background: #fff; border: 1px solid #d1d5db;
      border-radius: 0.5rem; padding: 0.5625rem 0.75rem;
      font-size: 0.8125rem; color: #111827;
      font-family: inherit; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .form-input:hover  { border-color: #86efad; }
    .form-input:focus  { border-color: #16a34a; box-shadow: 0 0 0 3px rgba(34,197,94,.15); }

    /* Primary button */
    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
      width: 100%; padding: .625rem 1.25rem;
      background: linear-gradient(135deg, #16a34a 0%, #0d9488 100%);
      color: #fff; font-size: .875rem; font-weight: 600;
      border-radius: .625rem; border: none; cursor: pointer;
      transition: opacity .15s, transform .15s, box-shadow .15s;
    }
    .btn-primary:hover  { opacity: .92; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(22,163,74,.35); }
    .btn-primary:active { opacity: 1;   transform: translateY(0); }

    /* Card entrance */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card { animation: slideUp .35s cubic-bezier(.34,1.2,.64,1) both; }
  </style>
</head>
<body class="bg-gradient-to-br from-brand-700 via-brand-600 to-teal-600 flex items-center justify-center p-4 font-sans">

  <div class="card w-full max-w-sm bg-white rounded-3xl shadow-2xl overflow-hidden">

    <!-- ── Branded header ───────────────────────── -->
    <div class="bg-gradient-to-r from-brand-600 to-teal-600 px-8 py-8 text-center">
      <!-- Leaf logo mark -->
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-white/20 mb-3 shadow-inner">
        <svg class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 24 24">
          <path d="M17 8C8 10 5.9 16.17 3.82 19.82 4.6 18.5 6.1 17 8.5 16c3-1.25 5-3.5 5.5-5.5C15 12.5 14 15 12 17c2-1 4-3.25 4.5-6.5C19 13 18 17 15 19c3.5-1 6-5 5.5-10.5C20 7 18.5 7.5 17 8z"/>
        </svg>
      </div>
      <h1 class="text-xl font-bold text-white tracking-tight">
        Eco<span class="opacity-75">Intelligence</span>
      </h1>
      <p class="text-white/65 text-xs mt-1.5 font-medium">Sustainability &amp; Climate Dashboard</p>
    </div>

    <!-- ── Login form ────────────────────────────── -->
    <div class="px-8 py-8">
      <h2 class="text-base font-bold text-gray-900 mb-5">Sign in to your account</h2>

      <!-- Error message (hidden by default) -->
      <div id="loginError"
        class="hidden mb-4 px-3 py-2.5 bg-red-50 border border-red-200 rounded-lg text-xs text-red-600 font-medium">
      </div>

      <div class="space-y-4">

        <!-- Email -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1.5" for="loginEmail">
            Email address
          </label>
          <input id="loginEmail" type="email"
            class="form-input" placeholder="admin@ecointel.io"
            autocomplete="email" />
        </div>

        <!-- Password -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1.5" for="loginPassword">
            Password
          </label>
          <!-- Password wrapper with toggle -->
          <div class="relative">
            <input id="loginPassword" type="password"
              class="form-input pr-10" placeholder="••••••••"
              autocomplete="current-password" />
            <button type="button" id="togglePwd"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors"
              aria-label="Toggle password visibility">
              <!-- Eye icon (default = show) -->
              <svg id="eyeIcon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M1 12S5 4 12 4s11 8 11 8-4 8-11 8S1 12 1 12z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember me + Forgot -->
        <div class="flex items-center justify-between pt-0.5">
          <label class="flex items-center gap-2 text-xs text-gray-500 cursor-pointer select-none">
            <input type="checkbox" id="rememberMe" checked
              class="rounded border-gray-300 text-brand-600 focus:ring-brand-500 cursor-pointer" />
            Remember me
          </label>
          <a href="#" class="text-xs text-brand-600 hover:text-brand-700 font-semibold">
            Forgot password?
          </a>
        </div>

      </div><!-- end space-y-4 -->

      <!-- Sign In button -->
      <button id="loginBtn" class="btn-primary mt-6">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M11 16l-4-4m0 0 4-4m-4 4h14m-5 4v1a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h7a3 3 0 0 1 3 3v1"/>
        </svg>
        Sign In
      </button>

      <!-- Demo hint -->
      <p class="text-center text-[11px] text-gray-400 mt-4">
        Demo credentials:
        <span class="font-semibold text-gray-500">admin@ecointel.io</span>
        &nbsp;/&nbsp;
        <span class="font-semibold text-gray-500">password</span>
      </p>
    </div><!-- end form -->

  </div><!-- end card -->

  <script>
    'use strict';

    const VALID_EMAIL = 'admin@ecointel.io';
    const VALID_PASS  = 'password';

    const emailInput = document.getElementById('loginEmail');
    const passInput  = document.getElementById('loginPassword');
    const errEl      = document.getElementById('loginError');
    const loginBtn   = document.getElementById('loginBtn');
    const togglePwd  = document.getElementById('togglePwd');
    const eyeIcon    = document.getElementById('eyeIcon');

    /** Show an inline error message. */
    function showError(msg) {
      errEl.textContent = msg;
      errEl.classList.remove('hidden');
    }

    /** Attempt authentication and redirect on success. */
    function attemptLogin() {
      const email    = emailInput.value.trim();
      const password = passInput.value;

      if (!email) { showError('Please enter your email address.'); emailInput.focus(); return; }
      if (!password) { showError('Please enter your password.'); passInput.focus(); return; }

      if (email === VALID_EMAIL && password === VALID_PASS) {
        errEl.classList.add('hidden');
        // Redirect to dashboard
        window.location.href = 'index.html';
      } else {
        showError('Invalid email or password. Check the demo credentials below.');
        passInput.value = '';
        passInput.focus();
      }
    }

    loginBtn.addEventListener('click', attemptLogin);

    // Enter key submits from either field
    [emailInput, passInput].forEach((el) => {
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter') attemptLogin(); });
    });

    // Toggle password visibility
    togglePwd.addEventListener('click', () => {
      const isText = passInput.type === 'text';
      passInput.type = isText ? 'password' : 'text';
      // Swap icon: eye ↔ eye-off
      eyeIcon.innerHTML = isText
        ? '<path stroke-linecap="round" stroke-linejoin="round" d="M1 12S5 4 12 4s11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>'
        : '<path stroke-linecap="round" stroke-linejoin="round" d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22"/>';
    });
  </script>
</body>
</html>
